<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Dashboard - TRACE-X</title>
        <link rel="stylesheet" href="/static/css/style.css">
    </head>
    <body>
        <nav>
            <div class="brand">TRACE-X</div>
            <div>
                <a href="/upload.html">Upload Evidence</a>
                <a id="activity-link" href="/activity.html" hidden>Activity Log</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </nav>
        <main class="container">
            <div class="top">
                <div>
                    <span class="badge">INVESTIGATOR CONSOLE</span>
                    <h1>Evidence Dashboard</h1>
                    <p id="welcome"></p>
                </div>
                <a class="button" href="/upload.html">+ New Evidence</a>
                <a href="/login-history.html">Login History</a>
            </div>
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Evidence</h3>
                    <h1 id="total">0</h1>
                </div>
                <div class="stat-card">
                    <h3>AI Suspicious</h3>
                    <h1 id="suspicious">0</h1>
                </div>
                <div class="stat-card">
                    <h3>High Risk</h3>
                    <h1 id="high">0</h1>
                </div>
                <div class="stat-card">
                    <h3>Medium Risk</h3>
                    <h1 id="medium">0</h1>
                </div>
                <div class="stat-card">
                    <h3>Low Risk</h3>
                    <h1 id="low">0</h1>
                </div>
            </div>
            <section id="recent-activity-section" class="card" hidden>
                <div class="top">
                    <h2>Recent Activity</h2>
                    <a href="/activity.html">View all activity</a>
                </div>
                <p id="recent-activity-status" role="status"></p>
                <div id="recent-activity-list" class="activity-list"></div>
            </section>
            <div class="card">
                <h2>Evidence Register</h2>
                <div id="table"></div>
            </div>
        </main>
        <script src="/static/js/dashboard.js"></script>
    </body>
</html>
