<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Activity Log - TRACE-X</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav>
    <div class="brand">TRACE-X</div>
    <div><a href="/dashboard.html">Dashboard</a><a href="#" onclick="logout()">Logout</a></div>
  </nav>
  <main class="container">
    <div class="top">
      <div><span class="badge">ADMIN</span><h1>Activity Log</h1>
        <p>Sign-ins, sign-outs, and evidence actions recorded by TRACE-X.</p>
      </div>
    </div>
    <div class="card">
      <p id="activity-status" role="status"></p>
      <div id="activity-table"></div>
      <div class="top">
        <button id="previous" type="button" onclick="changePage(-1)">Previous</button>
        <span id="page-label"></span>
        <button id="next" type="button" onclick="changePage(1)">Next</button>
      </div>
    </div>
  </main>
  <script src="/static/js/activity.js"></script>
</body>
</html>
